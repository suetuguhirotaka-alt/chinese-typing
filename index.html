<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🇨🇳 中国語タイピング練習</title>
  <style>
    :root {
      --primary-color: #de2910;
      --bg-color: #f5f6f8;
      --card-bg: #ffffff;
      --text-color: #111111;
      --ok-bg: #effaf0;
      --bad-bg: #fff1f1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    main {
      width: 100%;
      max-width: 760px;
      background: var(--card-bg);
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 24px;
    }

    .layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 16px;
      align-items: stretch;
      margin-bottom: 20px;
    }

    .coach {
      position: relative;
      background: #fff8f8;
      border: 2px dashed #ffcdd2;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      overflow: hidden;
    }

    .coach-avatar {
      font-size: 4rem;
      user-select: none;
    }

    .bubble {
      position: absolute;
      bottom: 12px;
      left: 10px;
      right: 10px;
      background: rgba(17, 17, 17, 0.85);
      color: #fff;
      border: 1px solid #ffde00;
      border-radius: 12px;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.2s ease;
    }

    .bubble.show {
      opacity: 1;
      transform: translateY(0);
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 20px;
      border: 1px solid #e9edf3;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      align-items: center;
    }

    button {
      font-size: 15px;
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      background: #e9edf3;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover { background: #dce2eb; }

    button.primary {
      background: var(--primary-color);
      color: #fff;
      font-weight: bold;
    }

    button.primary:hover { background: #b71c1c; }

    #count {
      margin-left: auto;
      font-weight: bold;
      color: #666;
    }

    .chinese-title {
      font-size: 32px;
      font-weight: 800;
      text-align: center;
      color: var(--primary-color);
      margin: 16px 0 4px;
      min-height: 1.3em;
    }

    .meaning-subtitle {
      text-align: center;
      color: #444;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 16px;
      min-height: 1.2em;
    }

    .pinyin-box {
      font-family: monospace;
      font-size: 24px;
      text-align: center;
      letter-spacing: 2px;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #dee2e6;
      margin-bottom: 12px;
      min-height: 52px;
      word-break: break-all;
    }

    .char-correct { color: #28a745; font-weight: bold; }
    .char-wrong { color: #0d47a1; background-color: #e3f2fd; font-weight: bold; padding: 0 2px; border-radius: 3px; }
    .char-next {
      color: var(--primary-color);
      font-weight: bold;
      text-decoration: underline;
      animation: blink 0.8s infinite alternate;
    }

    @keyframes blink {
      0% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.3; }
    }

    input {
      box-sizing: border-box;
      width: 100%;
      font-size: 24px;
      font-family: monospace;
      text-align: center;
      padding: 12px;
      border: 3px solid #ccd2da;
      border-radius: 12px;
      margin: 8px 0;
      outline: none;
    }

    input.ok { background: var(--ok-bg) !important; border-color: #28a745 !important; }
    input.bad { background: var(--bad-bg) !important; border-color: #0d47a1 !important; }

    .guide {
      text-align: center;
      font-weight: 800;
      color: var(--primary-color);
      margin: 8px 0;
      min-height: 24px;
    }

    .kbd {
      padding: 12px;
      background: #ffffff;
      border-radius: 18px;
      border: 1px solid #e9edf3;
      overflow-x: auto;
    }

    .kbdtitle { text-align: center; font-weight: 800; margin-bottom: 8px; font-size: 14px; color: #555; }
    .krow { display: flex; gap: 4px; justify-content: center; margin: 4px 0; }
    .key {
      min-width: 42px;
      height: 42px;
      border: 2px solid #d4d8df;
      border-radius: 8px;
      background: #f0f0f0;
      text-align: center;
      line-height: 38px;
      font-weight: 800;
      font-size: 16px;
      color: #333;
    }
    .key.nextkey {
      background: var(--primary-color) !important;
      border-color: #b71c1c !important;
      color: #fff !important;
      transform: translateY(-2px);
      box-shadow: 0 3px 8px rgba(222, 41, 16, 0.4);
    }

    @media (max-width: 650px) {
      .layout { grid-template-columns: 1fr; }
      .coach { min-height: 120px; }
      .key { min-width: 32px; height: 36px; line-height: 32px; font-size: 13px; }
    }
  </style>
</head>
<body>

<main>
  <h2>🇨🇳 中国語タイピング練習</h2>

  <div class="layout">
    <div class="coach" id="coach">
      <div class="coach-avatar">🐼</div>
      <div class="bubble" id="bubble">太棒了！</div>
    </div>

    <div class="card">
      <div class="btn-group">
        <button class="primary" id="start">スタート [1]</button>
        <button id="skip">スキップ [2]</button>
        <button id="speak">🔊 音声 [3]</button>
        <span id="count"></span>
      </div>

      <div id="chineseDisplay" class="chinese-title">「スタート」を押して開始</div>
      <div id="meaningDisplay" class="meaning-subtitle"></div>

      <div id="pinyinBox" class="pinyin-box"></div>

      <input id="answer" type="text" autocomplete="off" placeholder="ここに入力（英字小文字）" disabled>
      
      <div id="guide" class="guide"></div>
    </div>
  </div>

  <div class="kbd">
    <div class="kbdtitle">キーボードガイド</div>
    <div id="keyboard"></div>
  </div>
</main>

<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/1SujbVxzfJpTtGOt5dPVbw3sv6JY-VwxHvXaCf9xToh8/gviz/tq?tqx=out:csv";

  let wordList = [];
  let currentWord = null;
  let currentIndex = 0;
  let score = 0;
  const TOTAL_QUESTIONS = 10;
  let isGaming = false;
  let isLocked = false;

  const $ = id => document.getElementById(id);

  const ROWS = [
    ["Q","W","E","R","T","Y","U","I","O","P"],
    ["A","S","D","F","G","H","J","K","L"],
    ["Z","X","C","V","B","N","M"]
  ];

  function buildKbd() {
    let el = $("keyboard");
    el.innerHTML = "";
    ROWS.forEach(row => {
      let r = document.createElement("div");
      r.className = "krow";
      row.forEach(k => {
        let d = document.createElement("div");
        d.className = "key";
        d.dataset.key = k;
        d.textContent = k;
        r.appendChild(d);
      });
      el.appendChild(r);
    });
  }
  buildKbd();

  // 文字列整形関数（クォーテーションやスペースを完全に除去）
  function cleanText(str) {
    if (!str) return "";
    return str.replace(/^"+|"+$/g, '').replace(/"/g, '').trim();
  }

  // CSVパース
  function parseCSV(text) {
    const lines = text.split('\n');
    return lines.map(line => {
      const matches = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
      if (!line.includes('"')) {
        return line.split(',').map(s => cleanText(s));
      }
      return line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(s => cleanText(s));
    });
  }

  // 読み込み
  fetch(CSV_URL)
    .then(res => res.text())
    .then(csv => {
      const rows = parseCSV(csv).slice(1);
      wordList = rows.map(r => ({
        chinese: cleanText(r[0]),
        // スペースをすべて取り除いたアルファベットのみのピンインに変換
        pinyin: cleanText(r[1]).toLowerCase().replace(/\s+/g, ''),
        meaning: cleanText(r[2])
      })).filter(item => item.chinese && item.pinyin);
    })
    .catch(() => {});

  function updateGuide() {
    document.querySelectorAll(".key").forEach(x => x.classList.remove("nextkey"));
    if (!isGaming || !currentWord) {
      $("guide").textContent = "";
      return;
    }

    const target = currentWord.pinyin;
    // 入力側もスペースを除去して判定
    const typed = $("answer").value.toLowerCase().replace(/\s+/g, '');

    let formattedHtml = "";
    let firstMismatchIndex = -1;

    for (let i = 0; i < target.length; i++) {
      if (i < typed.length) {
        if (typed[i] === target[i]) {
          formattedHtml += `<span class="char-correct">${target[i]}</span>`;
        } else {
          formattedHtml += `<span class="char-wrong">${target[i]}</span>`;
          if (firstMismatchIndex === -1) firstMismatchIndex = i;
        }
      } else if (i === typed.length && firstMismatchIndex === -1) {
        formattedHtml += `<span class="char-next">${target[i]}</span>`;
      } else {
        formattedHtml += `<span>${target[i]}</span>`;
      }
    }

    $("pinyinBox").innerHTML = formattedHtml;

    if (firstMismatchIndex !== -1 || typed.length > target.length) {
      $("answer").className = "bad";
      $("guide").textContent = "打ち間違いがあります。Backspaceで戻してください。";
      return;
    }

    $("answer").className = "";

    if (typed.length < target.length) {
      const nextChar = target[typed.length];
      const keyId = nextChar.toUpperCase();
      document.querySelector(`[data-key="${keyId}"]`)?.classList.add("nextkey");
      $("guide").textContent = `次に打つキー: ${keyId}`;
    } else {
      $("guide").textContent = "";
    }
  }

  function speakChinese() {
    if (!currentWord || !windowspeechSynthesis) return;
    const u = new SpeechSynthesisUtterance(currentWord.chinese);
    u.lang = "zh-CN";
    u.rate = 0.85;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  function react() {
    const b = $("bubble");
    const phrases = ["很好！", "太棒了！", "真厉害！", "正确！"];
    b.textContent = phrases[Math.floor(Math.random() * phrases.length)];
    b.classList.add("show");
    setTimeout(() => b.classList.remove("show"), 1200);
  }

  function nextQuestion() {
    if (currentIndex >= TOTAL_QUESTIONS) return endGame();

    isLocked = false;
    currentIndex++;

    const rand = Math.floor(Math.random() * wordList.length);
    currentWord = wordList[rand];

    $("chineseDisplay").textContent = currentWord.chinese;
    $("meaningDisplay").textContent = currentWord.meaning;
    $("count").textContent = `${currentIndex} / ${TOTAL_QUESTIONS}`;
    $("answer").value = "";
    $("answer").disabled = false;
    $("answer").focus();

    updateGuide();
    speakChinese();
  }

  function startGame() {
    if (wordList.length === 0) return;
    isGaming = true;
    currentIndex = 0;
    score = 0;
    $("start").disabled = true;
    nextQuestion();
  }

  function endGame() {
    isGaming = false;
    $("chineseDisplay").textContent = "🎉 ゲーム終了！";
    $("meaningDisplay").textContent = `正答数: ${score} / ${TOTAL_QUESTIONS}`;
    $("pinyinBox").innerHTML = "";
    $("count").textContent = "";
    $("answer").disabled = true;
    $("answer").value = "";
    $("start").disabled = false;
    $("start").textContent = "もう一度スタート [1]";
    updateGuide();
  }

  function checkAnswer() {
    if (!isGaming || !currentWord || isLocked) return;

    const typed = $("answer").value.toLowerCase().replace(/\s+/g, '');
    const target = currentWord.pinyin;

    if (typed === target) {
      isLocked = true;
      score++;
      $("answer").className = "ok";
      react();
      setTimeout(nextQuestion, 1200);
    }
  }

  $("start").onclick = startGame;
  $("skip").onclick = () => isGaming && nextQuestion();
  $("speak").onclick = speakChinese;

  $("answer").oninput = () => {
    updateGuide();
    checkAnswer();
  };

  document.addEventListener("keydown", e => {
    if (e.repeat) return;
    const tag = (document.activeElement?.tagName || "").toLowerCase();
    if (tag === "input" && e.key !== "3") return;

    if (e.key === "1" && !isGaming) { e.preventDefault(); startGame(); }
    else if (e.key === "2" && isGaming) { e.preventDefault(); nextQuestion(); }
    else if (e.key === "3" && isGaming) { e.preventDefault(); speakChinese(); }
  });
</script>

</body>
</html>
