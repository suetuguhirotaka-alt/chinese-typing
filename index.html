<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🇨🇳 中国語タイピング練習</title>
  <style>
    :root {
      --primary-color: #de2910; /* 中国紅 */
      --secondary-color: #ffde00; /* 黄星 */
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-green: #28a745;
      --accent-red: #dc3545;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    main {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--primary-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* キャラクター・演出エリア */
    .character-area {
      background: #fff8f8;
      border: 2px dashed #ffcdd2;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      position: relative;
    }

    .badge-status {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-top: 8px;
    }

    /* 問題カード */
    .question-card {
      background: #f1f3f5;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: left;
    }

    .info-label {
      font-size: 0.85rem;
      color: #6c757d;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .meaning-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: #212529;
      margin-bottom: 16px;
      min-height: 1.5em;
    }

    .chinese-text {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary-color);
      letter-spacing: 2px;
      margin-bottom: 12px;
      min-height: 1.2em;
    }

    .pinyin-guide {
      font-size: 1.1rem;
      color: #495057;
      font-family: monospace;
      background: #ffffff;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #dee2e6;
      min-height: 1.5em;
    }

    /* タイピング入力部分 */
    .input-container {
      margin-bottom: 20px;
    }

    .typing-input {
      width: 100%;
      padding: 14px;
      font-size: 1.2rem;
      font-family: monospace;
      border: 2px solid #ced4da;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
    }

    .typing-input:focus {
      border-color: var(--primary-color);
    }

    /* プログレスバー */
    .progress-container {
      width: 100%;
      background-color: #e9ecef;
      border-radius: 8px;
      height: 10px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: var(--primary-color);
      transition: width 0.3s ease;
    }

    /* ボタン類 */
    .btn-start {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(222, 41, 16, 0.2);
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn-start:hover {
      background-color: #b71c1c;
      transform: translateY(-1px);
    }

    .btn-start:active {
      transform: translateY(1px);
    }

    /* ガイド */
    .guide-box {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e9ecef;
      font-size: 0.85rem;
      color: #6c757d;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<main>
  <h1>🇨🇳 中国語タイピング練習</h1>

  <div class="character-area">
    <div style="font-size: 2.5rem;">🐼</div>
    <div id="statusBadge" class="badge-status">「スタート」を押して開始</div>
  </div>

  <div class="progress-container">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <div class="question-card">
    <div class="info-label">【日本語の意味】</div>
    <div id="meaningDisplay" class="meaning-text">ここに意味が表示されます</div>

    <div class="info-label">【中国語】</div>
    <div id="chineseDisplay" class="chinese-text">学而时习之</div>

    <div class="info-label">【ピンインガイド（入力用）】</div>
    <div id="pinyinDisplay" class="pinyin-guide">xue er shi xi zhi</div>
  </div>

  <div class="input-container">
    <input type="text" id="typingInput" class="typing-input" placeholder="ここに入力（英字小文字）" disabled autocomplete="off">
  </div>

  <button id="startBtn" class="btn-start">スタート</button>

  <div class="guide-box">
    <div>💡 <strong>タイピングルール:</strong></div>
    <div>ピンインガイドのアルファベットを順番に入力してください（声調記号不要）。</div>
    <div>200個のデータから毎回ランダムで10問出題します。</div>
  </div>
</main>

<script>
  // スプレッドシート（公開CSV URL）
  const SPREADSHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1SujbVxzfJpTtGOt5dPVbw3sv6JY-VwxHvXaCf9xToh8/gviz/tq?tqx=out:csv';

  let allQuestions = [];
  let currentQuestions = [];
  let currentIndex = 0;
  let isGaming = false;

  const startBtn = document.getElementById('startBtn');
  const typingInput = document.getElementById('typingInput');
  const chineseDisplay = document.getElementById('chineseDisplay');
  const pinyinDisplay = document.getElementById('pinyinDisplay');
  const meaningDisplay = document.getElementById('meaningDisplay');
  const statusBadge = document.getElementById('statusBadge');
  const progressBar = document.getElementById('progressBar');

  // CSVの取得・パース
  async function loadQuestions() {
    try {
      const response = await fetch(SPREADSHEET_CSV_URL);
      const csvText = await response.text();
      const rows = parseCSV(csvText);
      
      // ヘッダー除外 (A:中国語, B:ピンイン, C:意味)
      allQuestions = rows.slice(1).map(row => ({
        chinese: row[0] || '',
        pinyin: row[1] || '',
        meaning: row[2] || ''
      })).filter(q => q.chinese && q.pinyin);

      statusBadge.textContent = "準備完了！「スタート」を押してください";
    } catch (error) {
      console.error(error);
      statusBadge.textContent = "データの読み込みに失敗しました";
    }
  }

  // 簡易CSVパース関数
  function parseCSV(text) {
    const lines = text.split('\n');
    return lines.map(line => {
      const matches = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
      if (!line.includes('"')) {
        return line.split(',').map(s => s.trim().replace(/^"|"$/g, ''));
      }
      return line.split('","').map(s => s.replace(/"/g, '').trim());
    });
  }

  // ゲーム開始
  function startGame() {
    if (allQuestions.length === 0) return;

    // 10問ランダム抽出
    const shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
    currentQuestions = shuffled.slice(0, 10);
    currentIndex = 0;
    isGaming = true;

    startBtn.textContent = "リセット";
    typingInput.disabled = false;
    typingInput.value = "";
    typingInput.focus();

    showQuestion();
  }

  // 問題表示
  function showQuestion() {
    if (currentIndex >= currentQuestions.length) {
      endGame();
      return;
    }

    const q = currentQuestions[currentIndex];
    chineseDisplay.textContent = q.chinese;
    pinyinDisplay.textContent = q.pinyin;
    meaningDisplay.textContent = q.meaning;

    statusBadge.textContent = `第 ${currentIndex + 1} / 10 問`;
    progressBar.style.width = `${(currentIndex / 10) * 100}%`;

    typingInput.value = "";
  }

  // 判定処理（スペースや大文字・小文字・記号の違いを柔軟に判定）
  function normalizeText(text) {
    return text.toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  typingInput.addEventListener('input', () => {
    if (!isGaming) return;

    const currentTarget = currentQuestions[currentIndex].pinyin;
    const inputVal = typingInput.value;

    if (normalizeText(inputVal) === normalizeText(currentTarget)) {
      // 正解音や演出
      statusBadge.textContent = "太棒了！(素晴らしい！)";
      currentIndex++;
      setTimeout(() => {
        showQuestion();
      }, 300);
    }
  });

  // 終了処理
  function endGame() {
    isGaming = false;
    typingInput.disabled = true;
    progressBar.style.width = "100%";
    statusBadge.textContent = "🎉 PERFECT! 全問クリア！";
    startBtn.textContent = "もう一度プレイ";
  }

  startBtn.addEventListener('click', startGame);

  // 初期ロード
  loadQuestions();
</script>

</body>
</html>
